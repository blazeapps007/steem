services:
  witness:
    image: steemblazer/trimmed-steem:latest
    container_name: steem-witness
    # Uncomment to accept inbound P2P connections (recommended for a real
    # witness so peers can reach you directly; not required to sync out).
    #ports:
    #  - "2001:2001"
    volumes:
      - ./witness_node_data_dir:/steem
    command: --data-dir=/steem
    restart: unless-stopped
    # steemd/MIRA opens dozens of separate rocksdb_* column families, each
    # with many files -- the default per-container nofile limit (often 1024
    # soft) is nowhere near enough and fails with "Too many open files" /
    # "Column family not found" during startup.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
