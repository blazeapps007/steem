services:
  witness:
    image: steemblazer/trimmed-steem:latest
    container_name: steem-witness
    volumes:
      - ./witness_node_data_dir:/steem
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"